version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: former-schools
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d former-schools"]
      interval: 5s
      timeout: 5s
      retries: 5
  former-schools:
    image: nathan5471/former-schools-of-virginia:latest
    container_name: web_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=
      - JWT_SECRET=
      - R2_TOKEN=
      - R2_ACCESS_KEY_ID=
      - R2_SECRET_ACCESS_KEY=
      - R2_BASE_URL=
      - R2_BUCKET_NAME=
      - R2_PUBLIC_BASE_URL=
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: